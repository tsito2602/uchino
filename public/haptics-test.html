<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>触覚テスト</title>
<style>body{font:16px/1.6 -apple-system,system-ui,sans-serif;background:#f5f3ee;color:#26221e;margin:0;padding:24px 16px 48px}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#7a736b;font-size:13px}button,label.native{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;margin:0 0 10px;padding:0 18px;border:1px solid #e2ddd4;border-radius:16px;background:#fffdf9;color:inherit;font:inherit;text-align:left;box-sizing:border-box}small{color:#7a736b}.cover{position:relative;display:flex;align-items:center;min-height:56px;margin:0 0 10px;padding:0 18px;border:1px solid #e2ddd4;border-radius:16px;background:#fffdf9}.cover input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}label.native{position:relative}#info{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#fff;border-radius:12px;padding:12px;color:#26221e}</style></head>
<body><h1>触覚テスト</h1><p>上から順に押して、震えたものの記号を教えてください。</p>
<button id="a">A 今のアプリの方式<small>隠したスイッチを使い回す</small></button>
<button id="b">B 毎回新しいスイッチを作る<small>head に置いて押してすぐ消す</small></button>
<button id="c">C 毎回新しいスイッチを作る<small>body に置く</small></button>
<button id="d">D B を2回続けて鳴らす<small>強さの代わりになるか</small></button>
<button id="e">E Vibration API<small>Android 用</small></button>
<label class="native">F 本物のスイッチを直接押す<input type="checkbox" switch></label>
<p style="margin-top:18px">ここから下は、見えないスイッチを重ねた方式です。</p>
<label class="native" id="g">G ラベル全体を押す<small>スイッチは透明</small><input type="checkbox" switch style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px"></label>
<div class="cover" id="h"><span>H 透明なスイッチを全面に重ねる</span><input type="checkbox" switch></div>
<div class="cover" id="i"><span>I ほぼ透明（0.02）なスイッチを全面に重ねる</span><input type="checkbox" switch style="opacity:.02"></div>
<div class="cover" id="j"><span>J H と同じで、スイッチの見た目を消す</span><input type="checkbox" switch style="-webkit-appearance:none;appearance:none"></div>
<div class="cover" id="k"><span>K H と同じで、押したらボタンの処理も動く</span><input type="checkbox" switch></div>
<div id="info"></div>
<script src="/haptics-test.js"></script></body></html>
