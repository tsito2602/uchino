<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>触覚テスト</title>
<style>body{font:16px/1.6 -apple-system,system-ui,sans-serif;background:#f5f3ee;color:#26221e;margin:0;padding:24px 16px 48px}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#7a736b;font-size:13px}button,label.native{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;margin:0 0 10px;padding:0 18px;border:1px solid #e2ddd4;border-radius:16px;background:#fffdf9;color:inherit;font:inherit;text-align:left;box-sizing:border-box}small{color:#7a736b}#info{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#fff;border-radius:12px;padding:12px;color:#26221e}</style></head>
<body><h1>触覚テスト</h1><p>上から順に押して、震えたものの記号を教えてください。</p>
<button id="a">A 今のアプリの方式<small>隠したスイッチを使い回す</small></button>
<button id="b">B 毎回新しいスイッチを作る<small>head に置いて押してすぐ消す</small></button>
<button id="c">C 毎回新しいスイッチを作る<small>body に置く</small></button>
<button id="d">D B を2回続けて鳴らす<small>強さの代わりになるか</small></button>
<button id="e">E Vibration API<small>Android 用</small></button>
<label class="native">F 本物のスイッチを直接押す<input type="checkbox" switch></label>
<div id="info"></div>
<script src="/haptics-test.js"></script></body></html>
