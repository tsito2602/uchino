<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta id="app-theme-color" name="theme-color" content="#f5f3ee"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="uchino"/><meta name="description" content="うちのレシピを、ひとつに。"/><link rel="icon" href="/icon.svg" type="image/svg+xml"/><link rel="apple-touch-icon" href="/apple-touch-icon-v2.png"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap"/><title>uchino</title><style>
/* Inline so the very first paint, even offline, is the launch animation (as kondo and uchiwake).
   The pot settles, its lid drops on and rattles as it comes to the boil, steam rises, then the name. */
#initial-boot{--boot-ink:#26221e;position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#f5f3ee;color:var(--boot-ink);animation:boot-failsafe 0s 8s forwards}
@media (prefers-color-scheme:dark){:root:not([data-brand-theme=light]) #initial-boot{--boot-ink:#efefec;background:#131313}}
:root[data-brand-theme=dark] #initial-boot{--boot-ink:#efefec;background:#131313}
.boot-brand{display:grid;justify-items:center;gap:24px;transform:translateY(-3vh)}
.boot-symbol{width:116px;height:168px;overflow:visible;fill:currentColor}
.boot-pot{transform-box:fill-box;transform-origin:50% 100%;animation:boot-pot 560ms cubic-bezier(.2,.8,.2,1) 120ms both}
.boot-lid{transform-box:fill-box;transform-origin:50% 100%;animation:boot-lid 620ms 460ms both,boot-rattle 420ms 1100ms both}
.boot-steam path{fill:none;stroke:currentColor;stroke-width:20;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;opacity:0;animation:boot-steam 900ms cubic-bezier(.3,.6,.3,1) both}
.boot-steam path:nth-child(1){animation-delay:1120ms}.boot-steam path:nth-child(2){animation-delay:1210ms}.boot-steam path:nth-child(3){animation-delay:1300ms}
.boot-name{display:flex;align-items:flex-end;gap:.07em;height:30px;font-size:30px;line-height:1}
.boot-name span{display:block;height:1em;animation:boot-letter 320ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(1380ms + var(--letter) * 55ms)}
.boot-name svg{display:block;height:100%;width:auto;fill:none;stroke:currentColor;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
#initial-boot.boot-leaving{animation:boot-leave 260ms ease-out both}
@keyframes boot-pot{0%{opacity:0;transform:translateY(46px) scale(.82,.7)}55%{opacity:1;transform:translateY(-6px) scale(.97,1.04)}78%{transform:translateY(0) scale(1.04,.95)}100%{opacity:1;transform:none}}
@keyframes boot-lid{0%{opacity:0;transform:translateY(-120px) rotate(-16deg);animation-timing-function:cubic-bezier(.55,0,.8,.35)}52%{opacity:1;transform:translateY(0) rotate(4deg) scale(1.04,.86);animation-timing-function:cubic-bezier(.2,.7,.3,1)}72%{transform:translateY(-14px) rotate(-3deg)}88%{transform:translateY(0) rotate(1deg) scale(1.02,.96)}100%{opacity:1;transform:none}}
@keyframes boot-rattle{0%,100%{transform:none}18%{transform:translateY(-12px) rotate(-4deg)}36%{transform:translateY(0) rotate(1deg)}56%{transform:translateY(-8px) rotate(3deg)}76%{transform:translateY(0)}}
@keyframes boot-steam{0%{opacity:0;stroke-dashoffset:1000;transform:translateY(16px)}20%{opacity:.42}70%{opacity:.32}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-26px)}}
@keyframes boot-letter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes boot-leave{to{opacity:0;visibility:hidden}}
@keyframes boot-failsafe{to{visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){#initial-boot,#initial-boot *{animation:none!important}.boot-steam{display:none}}
</style><script type="module" src="/src/theme-init.ts"></script></head><body><div id="initial-boot" role="status" aria-label="uchinoを読み込み中"><div class="boot-brand" aria-hidden="true">
<svg class="boot-symbol" viewBox="290 0 490 730" xmlns="http://www.w3.org/2000/svg"><g class="boot-steam"><path pathLength="1000" d="M445 178C425 148 465 124 445 94C425 64 465 42 445 14"/><path pathLength="1000" d="M545 150C525 120 565 96 545 66C525 36 565 16 545 -10"/><path pathLength="1000" d="M645 196C625 166 665 142 645 112C625 82 665 60 645 32"/></g><path class="boot-pot" d="M360 375C412 373 508 375 563 377C649 380 699 396 737 447C774 497 773 553 753 592C722 654 652 686 578 696C505 706 434 689 388 657C346 627 320 582 318 538C317 515 320 505 333 504L353 504C374 504 373 521 376 539C380 565 391 579 414 585C461 598 535 594 565 581C600 566 616 541 616 513C616 484 603 464 576 458C546 450 441 455 397 457L359 458C326 459 319 437 319 413C319 388 331 375 360 375Z"/><path class="boot-lid" d="M320 300C324 269 352 243 390 240C432 235 476 242 510 249L512 232C482 223 484 190 504 182C514 177 524 181 549 187L574 192C605 200 602 230 582 239L566 240L563 256C614 270 656 283 686 303C723 327 729 355 709 366C700 372 691 370 677 367L345 313C329 311 320 308 320 300Z"/></svg>

</strong></div></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
